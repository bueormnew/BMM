[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bueorm"
version = "1.0.0"
description = "Bueorm - Modular Deep Learning Architecture & Model Framework (BDA, TBV, Transformer, MoE, VLM)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gerson Fabián Buenahora Ormaza", email = "gersonfabibuenahoraormaza@gmail.com" }]
maintainers = [{ name = "Gerson Fabián Buenahora Ormaza", email = "gersonfabibuenahoraormaza@gmail.com" }]
license = { text = "MIT" }
keywords = ["deep-learning", "transformer", "attention", "vision", "multimodal", "moe", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "safetensors>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/bueormnew/BMM"
Repository = "https://github.com/bueormnew/BMM.git"
Issues = "https://github.com/bueormnew/BMM/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bueorm*", "BDA*", "TBV*", "transformer*"]
