[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bueorm"
version = "1.0.0"
description = "Bueorm - Modular Deep Learning Architecture & Model Framework (BDA, TBV, Transformer, MoE, VLM)"
readme = "README.md"
authors = [{ name = "Gerson Fabián Buenahora Ormaza", email = "bueorm@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bueorm*", "BDA*", "TBV*", "transformer*"]
